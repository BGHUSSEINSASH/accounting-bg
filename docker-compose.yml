version: '3.9'

services:
  # ================================================
  # PostgreSQL Database
  # ================================================
  postgres:
    image: postgres:16-alpine
    container_name: accounting_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: accounting_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accounting_pass_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.postgresql.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting_user -d accounting"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================================
  # Backend API (Express + TypeScript)
  # ================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: accounting_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://accounting_user:${POSTGRES_PASSWORD:-accounting_pass_change_me}@postgres:5432/accounting
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-in-production-please}
      REFRESH_SECRET: ${REFRESH_SECRET:-change-this-refresh-secret-in-production-please}
      JWT_EXPIRES_IN: 24h
      REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:80}
      FRONTEND_ORIGIN: ${FRONTEND_URL:-http://localhost:80}
      UPLOAD_DIR: /app/backend/uploads
      BACKUP_DIR: /app/backend/backups
      CLOUD_PROVIDER: none
    volumes:
      - uploads_data:/app/backend/uploads
      - backups_data:/app/backend/backups
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ================================================
  # Nginx Reverse Proxy (Frontend + API routing)
  # ================================================
  nginx:
    image: nginx:alpine
    container_name: accounting_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  backups_data:
    driver: local
