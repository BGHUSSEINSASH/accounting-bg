services:
  - type: web
    name: accounting-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: '1'
      - key: DB_PATH
        value: /opt/render/project/src/backend/data/accounting.db
      - key: UPLOAD_DIR
        value: /opt/render/project/src/backend/uploads
      - key: BACKUP_DIR
        value: /opt/render/project/src/backend/backups
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_SECRET
        sync: false
      - key: CLOUD_PROVIDER
        value: supabase
      - key: CLOUD_SYNC_INTERVAL_MS
        value: '900000'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: accounting-files
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      - key: S3_PUBLIC_URL
        sync: false