services:
  # ================================================
  # Backend API — Express + TypeScript + PostgreSQL
  # ================================================
  - type: web
    name: accounting-bg-backend
    env: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install --ignore-scripts && npm run build
    startCommand: node dist/app.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: accounting-bg-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_ORIGIN
        sync: false   # Set this to your Vercel URL after deploying frontend
      - key: CORS_ORIGIN
        sync: false   # Same as FRONTEND_ORIGIN
      - key: TRUST_PROXY
        value: "1"
      - key: UPLOAD_DIR
        value: /opt/render/project/src/backend/uploads
      - key: BACKUP_DIR
        value: /opt/render/project/src/backend/backups
      - key: CLOUD_PROVIDER
        value: none

  # ================================================
  # PostgreSQL Database (Supabase-compatible schema)
  # ================================================
databases:
  - name: accounting-bg-db
    databaseName: accounting
    user: accounting_user
    region: frankfurt
    plan: free
    postgresMajorVersion: 16
