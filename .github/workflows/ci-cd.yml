name: CI/CD Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ================================================
  # Backend: TypeScript type-check + build
  # ================================================
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ================================================
  # Frontend: TypeScript type-check + Vite build
  # ================================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Vite build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  # ================================================
  # Deploy to Render - on push to main only
  # ================================================
  deploy-backend:
    name: Deploy Backend to Render
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            curl -X POST "$RENDER_HOOK"
            echo "Render deploy triggered"
          else
            echo "No RENDER_DEPLOY_HOOK configured - skipping"
          fi
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

  # ================================================
  # Deploy to Vercel - on push to main only
  # ================================================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            cd frontend
            vercel --token="$VERCEL_TOKEN" --prod --yes
          else
            echo "No VERCEL_TOKEN configured - skipping"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
